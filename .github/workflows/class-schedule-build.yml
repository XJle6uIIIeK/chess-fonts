name: Build ClassSchedule 0.5.2

on:
  push:
    branches: [class-schedule-build]
    paths:
      - 'class-schedule/**'
      - '.github/workflows/class-schedule-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        working-directory: class-schedule
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        working-directory: class-schedule
        run: gradle --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ClassSchedule-v0.5.2-release-unsigned
          path: class-schedule/app/build/outputs/apk/release/app-release-unsigned.apk
